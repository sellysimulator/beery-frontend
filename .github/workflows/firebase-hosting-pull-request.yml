name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint .
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
          # Fail the build if either is unset or points at the Hosting origin.
          # Unset, the bundle talks to beersim.web.app, whose SPA rewrite
          # answers REST with index.html while WebSocket upgrades are not
          # proxied at all — a green deploy with no working real-time feature.
          REQUIRE_BACKEND_ENV: '1'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BEERY_30D23 }}
          projectId: beery-30d23
